[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidara"
version = "0.1.0"
description = "Modern, accessible UI component library and design system toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Vidara Contributors" }]
keywords = ["ui", "components", "design-system", "accessibility", "a11y"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.0", "rich>=13.0", "jinja2>=3.1"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://github.com/migar-git/vidara"
Documentation = "https://migar-git.github.io/vidara/"
Repository = "https://github.com/migar-git/vidara"
Issues = "https://github.com/migar-git/vidara/issues"
Changelog = "https://github.com/migar-git/vidara/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/vidara"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "A",   # flake8-builtins
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "ANN", # flake8-annotations
  "S",   # flake8-bandit (security)
  "RUF", # ruff-specific
]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.isort]
known-first-party = ["vidara"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
  "slow: marks tests as slow",
  "a11y: accessibility-related tests",
  "visual: visual regression tests",
]

[tool.coverage.run]
source = ["vidara"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.",
]
